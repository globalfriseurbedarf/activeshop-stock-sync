name: ActiveShop CSV + Shopify Stock Sync

# Tek workflow: stok kontrolu 15 dakikada bir devam eder.
# CSV snapshot gunde iki kez (09:17 / 21:17, Turkiye saati) yenilenir.
# GitHub cron saatleri UTC'dir; Turkiye UTC+3 kullanir.
on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "17 6,18 * * *"
  workflow_dispatch:

# GitHub'in kendi GITHUB_TOKEN'i ile yalnizca CSV'yi commit edebilmek icin.
permissions:
  contents: write

concurrency:
  group: activeshop-stock-sync
  cancel-in-progress: false

jobs:
  sync-stock:
    runs-on: ubuntu-latest
    steps:
      - name: Repository dosyalarini al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Gereken Python paketlerini kur
        run: python -m pip install -r requirements.txt

      # Bu adim yalnizca gunde 2 defa ve manuel Run workflow'da calisir.
      # Indirme basarisizsa eski CSV korunur; Shopify stok isi devam eder.
      - name: ActiveShop CSV indir, dogrula ve yedek dosyayi yenile
        id: refresh_csv
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '17 6,18 * * *' }}
        continue-on-error: true
        env:
          FEED_URL: "https://b2b.activeshop.com.pl/media/productsfeed/b2b-de.csv"
          CSV_PATH: "b2b-de.csv"
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import io
          import os
          import time
          from pathlib import Path
          import requests

          url = os.environ["FEED_URL"]
          target = Path(os.environ.get("CSV_PATH", "b2b-de.csv"))

          def decode_bytes(content):
              for encoding in ("utf-8-sig", "utf-8", "cp1250", "iso-8859-2", "latin1"):
                  try:
                      return content.decode(encoding)
                  except UnicodeDecodeError:
                      pass
              raise RuntimeError("CSV metni cozumlenemedi")

          def validate_csv(content, label):
              if len(content) < 1024:
                  raise RuntimeError(f"{label}: dosya cok kucuk veya bos")
              head = content[:2048].lstrip().lower()
              if head.startswith((b"<!doctype", b"<html")) or b"just a moment" in head:
                  raise RuntimeError(f"{label}: CSV yerine HTML/Cloudflare sayfasi geldi")
              data = decode_bytes(content)
              for sep in (";", ",", "\t", "|"):
                  reader = csv.reader(io.StringIO(data, newline=""), delimiter=sep)
                  header = next(reader, [])
                  cols = {str(col).strip().lower().lstrip("\ufeff") for col in header}
                  if {"sku", "qty"}.issubset(cols):
                      sku_index = [str(v).strip().lower().lstrip("\ufeff") for v in header].index("sku")
                      count = 0
                      bad_rows = 0
                      for row in reader:
                          if not row or not any(value.strip() for value in row):
                              continue
                          if len(row) != len(header):
                              bad_rows += 1
                              continue
                          if row[sku_index].strip():
                              count += 1
                      if count < 100:
                          raise RuntimeError(f"{label}: yalnizca {count} SKU satiri var")
                      if bad_rows:
                          raise RuntimeError(f"{label}: {bad_rows} bozuk CSV satiri var")
                      print(f"{label}: {count} SKU satiri, {len(content):,} bayt, ayirici={sep!r}", flush=True)
                      return count
              raise RuntimeError(f"{label}: gerekli sku ve qty kolonlari bulunamadi")

          last_error = None
          content = None
          for attempt in range(1, 4):
              try:
                  print(f"ActiveShop CSV indiriliyor (deneme {attempt}/3): {url}", flush=True)
                  response = requests.get(
                      url,
                      timeout=(20, 100),
                      headers={"User-Agent": "Mozilla/5.0 (compatible; ActiveShopFeedSync/1.0)",
                               "Accept": "text/csv,text/plain,application/octet-stream,*/*"},
                      stream=True,
                  )
                  try:
                      response.raise_for_status()
                      chunks = []
                      total = 0
                      for chunk in response.iter_content(chunk_size=1024 * 1024):
                          if chunk:
                              total += len(chunk)
                              if total > 60 * 1024 * 1024:
                                  raise RuntimeError("CSV 60 MB sinirini asti")
                              chunks.append(chunk)
                      content = b"".join(chunks)
                  finally:
                      response.close()
                  break
              except requests.HTTPError as exc:
                  last_error = exc
                  # 401/403, kaynagin GitHub runner'a erisim vermedigini gosterir.
                  if exc.response is not None and exc.response.status_code in (401, 403):
                      raise RuntimeError(f"ActiveShop erisimi reddetti: HTTP {exc.response.status_code}") from exc
                  print(f"Indirme hatasi: {exc}", flush=True)
              except Exception as exc:
                  last_error = exc
                  print(f"Indirme hatasi: {exc}", flush=True)
              if attempt < 3:
                  time.sleep(attempt * 5)

          if content is None:
              raise RuntimeError(f"CSV indirilemedi: {last_error}")

          new_rows = validate_csv(content, "Yeni CSV")
          if target.is_file():
              old_content = target.read_bytes()
              old_rows = validate_csv(old_content, "Mevcut CSV")
              if len(content) < len(old_content) * 0.20 or new_rows < old_rows * 0.25:
                  raise RuntimeError("Yeni CSV onceki dosyadan supheli derecede kucuk; eski dosya korundu")
              if content == old_content:
                  print("CSV degismemis. GitHub'da yeni commit olusturulmayacak.", flush=True)
                  raise SystemExit(0)

          tmp = target.with_name(target.name + ".tmp")
          try:
              tmp.write_bytes(content)
              tmp.replace(target)
          finally:
              tmp.unlink(missing_ok=True)
          print("Yeni ve dogrulanmis CSV b2b-de.csv dosyasina kaydedildi.", flush=True)
          PY

      - name: CSV indirilemediyse uyar
        if: ${{ steps.refresh_csv.outcome == 'failure' }}
        run: |
          echo "::warning::ActiveShop CSV yenilenemedi; onceki b2b-de.csv korundu. GitHub runner icin ActiveShop engeli olabilir."
          echo "**CSV yenileme basarisiz:** Eski CSV korundu; stok senkronizasyonu devam ediyor." >> "$GITHUB_STEP_SUMMARY"

      # Degisiklik yoksa commit/push yapilmaz. Bu islem yalnizca CSV yenileme sonrasidir.
      - name: Degisen CSV'yi GitHub repository'sine kaydet
        id: commit_csv
        if: ${{ steps.refresh_csv.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          if git diff --quiet -- b2b-de.csv; then
            echo "CSV ayni: commit gerekmez."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- b2b-de.csv
          git commit -m "chore: refresh ActiveShop b2b-de.csv [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "CSV degisikligi GitHub'a kaydedildi." >> "$GITHUB_STEP_SUMMARY"

      - name: CSV GitHub'a kaydedilemediyse uyar
        if: ${{ steps.commit_csv.outcome == 'failure' }}
        run: |
          echo "::warning::CSV indirildi ama GitHub'a commit edilemedi. Actions > General > Workflow permissions bolumunde Read and write permissions kontrol edin."
          echo "**CSV commit hatasi:** Bu calismada yeni CSV kullanilabilir, ancak GitHub'daki yedek yenilenemedi." >> "$GITHUB_STEP_SUMMARY"

      # Mevcut stok mantigi AYNI: online CSV'yi dener, olmazsa repo CSV'sini kullanir.
      - name: ActiveShop stoklarini Shopify ile senkronize et
        env:
          FEED_URL: "https://b2b.activeshop.com.pl/media/productsfeed/b2b-de.csv"
          FALLBACK_FEED_PATH: "b2b-de.csv"
          SHOPIFY_SHOP: "bzjwyw-jv.myshopify.com"
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          SHOPIFY_API_VERSION: "2026-04"
          FEED_SKU_COLUMN: "sku"
          FEED_STOCK_COLUMN: "qty"
          SHOPIFY_LOCATION_ID: "119279812950"
          ZERO_OTHER_LOCATIONS: "true"
          DRY_RUN: "false"
          SET_MISSING_SKU_TO_ZERO: "false"
        run: python stock_sync.py

      - name: Stok raporunu yukle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-sync-report
          path: stock_sync_report.csv
          if-no-files-found: warn
