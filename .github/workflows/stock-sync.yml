name: ActiveShop Shopify Stock Sync

on:
  schedule:
    # Her 15 dakikada bir. Dakikalari ozellikle degistirdik;
    # bu dosyanin commit edilmesi devre disi schedule'i yeniden etkinlestirebilir.
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:

# Aylik keepalive commit'i icin gerekli.
permissions:
  contents: write

concurrency:
  group: stock-sync
  cancel-in-progress: false

jobs:
  sync-stock:
    runs-on: ubuntu-latest

    steps:
      - name: Dosyalari al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # GitHub, public repolarda 60 gun repo aktivitesi olmazsa scheduled
      # workflow'lari otomatik kapatabilir. Bu adim ayda bir kucuk bir commit
      # olusturarak repoda aktivite olmasini saglar.
      # Keepalive basarisiz olsa bile stok senkronu durmasin diye
      # continue-on-error kullaniliyor.
      - name: Schedule keepalive
        if: github.event_name == 'schedule'
        continue-on-error: true
        shell: bash
        run: |
          MONTH="$(date -u +'%Y-%m')"
          KEEPALIVE_FILE=".github/.schedule-keepalive"
          LAST_MONTH="$(cat "$KEEPALIVE_FILE" 2>/dev/null || true)"

          if [ "$LAST_MONTH" = "$MONTH" ]; then
            echo "Keepalive bu ay zaten yazildi: $MONTH"
            exit 0
          fi

          printf '%s\n' "$MONTH" > "$KEEPALIVE_FILE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$KEEPALIVE_FILE"
          git commit -m "chore: keep scheduled stock sync active ($MONTH)"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python paketlerini kur
        run: pip install -r requirements.txt

      - name: ActiveShop stoklarini Shopify ile senkronize et
        env:
          FEED_URL: "https://b2b.activeshop.com.pl/media/productsfeed/b2b-de.csv"

          SHOPIFY_SHOP: "bzjwyw-jv.myshopify.com"
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          SHOPIFY_API_VERSION: "2026-04"

          FEED_SKU_COLUMN: "sku"
          FEED_STOCK_COLUMN: "qty"

          # Artik stoklar bu lokasyona yazilacak: Lager in Wroclaw
          SHOPIFY_LOCATION_ID: "119279812950"

          # Yanlis depoda kalan stoklari 0 yapar.
          ZERO_OTHER_LOCATIONS: "true"

          # Ilk test icin true yapabilirsin. Gercek guncelleme icin false olmali.
          DRY_RUN: "false"

          # Feedde olmayan Shopify urunleri 0 yapilmasin.
          SET_MISSING_SKU_TO_ZERO: "false"

        run: python stock_sync.py

      - name: Raporu yukle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-sync-report
          path: stock_sync_report.csv
